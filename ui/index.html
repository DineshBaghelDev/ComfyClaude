<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyClaude Studio</title>
<script>try { const t = JSON.parse(localStorage.getItem('cc.theme')); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root {
  --bg: #0c0d0f; --panel: #141518; --panel2: #1b1d21; --line: #25282d; --line2: #33373e;
  --text: #e8eaed; --muted: #8a9099; --faint: #5c626b;
  --accent: #c8f53c; --accent-ink: #0c0d0f; --danger: #ff6b6b; --ok: #4ade80; --warn: #fbbf24;
  --mask: rgba(200, 245, 60, 1); --shadow: rgba(0, 0, 0, .4);
  --r: 10px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f4f2; --panel: #ffffff; --panel2: #f0f0ed; --line: #e2e2dd; --line2: #cfcfc9;
  --text: #17181a; --muted: #62666d; --faint: #9a9da3; --accent: #4f6d00; --accent-ink: #fff;
  --mask: rgba(120, 190, 0, 1); --shadow: rgba(0, 0, 0, .12); color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4f2; --panel: #ffffff; --panel2: #f0f0ed; --line: #e2e2dd; --line2: #cfcfc9;
    --text: #17181a; --muted: #62666d; --faint: #9a9da3; --accent: #4f6d00; --accent-ink: #fff;
    --mask: rgba(120, 190, 0, 1); --shadow: rgba(0, 0, 0, .12); color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-rows: 48px 1fr; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
header { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.brand b { color: var(--accent); }
.status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.bad { background: var(--danger); }
.spacer { flex: 1; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.ghost:hover { color: var(--text); border-color: var(--line2); }
.ghost.sm { padding: 3px 8px; font-size: 12px; }
.ghost.on { color: var(--text); border-color: var(--accent); }

main { display: grid; grid-template-columns: 340px 1fr 288px; min-height: 0; }

/* sidebar */
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
.modes { padding: 12px 12px 4px; }
.group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 2px 2px 6px; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
.mode { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent;
  background: none; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.mode:hover { background: var(--panel2); color: var(--text); }
.mode.on { background: var(--panel2); color: var(--text); border-color: var(--line2); }
.mode.on svg { color: var(--accent); }
.form { flex: 1; overflow-y: auto; padding: 4px 16px 16px; border-top: 1px solid var(--line); }
.form h2 { font-size: 15px; margin: 14px 0 2px; font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.f { margin: 12px 0; position: relative; }
.f > label, .lab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.lab .val { font-family: var(--mono); color: var(--text); font-size: 11.5px; }
.lab .link { background: none; border: 0; padding: 0; color: var(--faint); font-size: 11.5px; display: inline-flex; gap: 4px; align-items: center; }
.lab .link:hover { color: var(--text); } .lab .link svg { width: 13px; height: 13px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; outline: none; }
textarea { resize: vertical; min-height: 40px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea.prompt { min-height: 104px; font-size: 13.5px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
input[type=checkbox] { accent-color: var(--accent); }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { min-width: 0; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; background: none; border: 0; border-radius: 6px; padding: 5px 4px; color: var(--muted); font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 3px 9px; font-size: 11.5px; color: var(--muted); }
.chip:hover { color: var(--text); } .chip.on { border-color: var(--accent); color: var(--text); }
.x { font-family: var(--mono); color: var(--faint); }
.icon-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; color: var(--muted); display: inline-flex; }
.icon-btn:hover { color: var(--text); }
details.adv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.adv summary::before { content: "›"; transition: transform .15s; display: inline-block; }
details.adv[open] summary::before { transform: rotate(90deg); }
.note { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.note.warn { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); background: none; }
.slot { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line2); border-radius: 8px; padding: 6px; cursor: pointer; min-height: 56px; }
.slot:hover, .slot.drag { border-color: var(--accent); }
.slot img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: var(--bg); }
.slot .meta { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
.slot .meta b { display: block; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lora { display: grid; grid-template-columns: 1fr 64px 26px; gap: 6px; margin-bottom: 6px; align-items: center; }
.recent { position: absolute; z-index: 15; left: 0; right: 0; top: 24px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px;
  box-shadow: 0 12px 30px var(--shadow); max-height: 280px; overflow-y: auto; padding: 4px; }
.recent button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 9px; color: var(--muted);
  font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.recent button:hover { background: var(--panel2); color: var(--text); }
.go { padding: 12px 16px; border-top: 1px solid var(--line); }
.go button { width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 11px;
  font-weight: 650; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.go button:hover { filter: brightness(1.07); }
.go .hint { text-align: center; font-size: 11px; color: var(--faint); margin-top: 6px; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }

/* stage */
#stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stagebar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; }
.stagebar .seg button { padding: 4px 12px; }
.tools { display: flex; align-items: center; gap: 6px; }
.tools input[type=range] { width: 100px; }
.canvas { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; }
.frame { position: relative; display: inline-flex; max-width: 100%; max-height: 100%; }
.frame > img { max-width: 100%; max-height: calc(100vh - 48px - 46px - 40px - 150px); display: block; border-radius: 6px;
  box-shadow: 0 10px 40px var(--shadow); background: repeating-conic-gradient(#8882 0 25%, transparent 0 50%) 0 0/16px 16px; }
.frame.solo > img { max-height: calc(100vh - 48px - 46px - 40px - 60px); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; cursor: none; border-radius: 6px; touch-action: none; }
.cmp { position: absolute; inset: 0; cursor: ew-resize; border-radius: 6px; overflow: hidden; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cmp .line { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px #0008; pointer-events: none; }
.cmp .tag { position: absolute; top: 8px; font: 11px var(--mono); background: #000a; color: #fff; padding: 2px 7px; border-radius: 5px; pointer-events: none; }
#cursor { position: fixed; pointer-events: none; border: 1.5px solid #fff; border-radius: 50%; mix-blend-mode: difference; display: none; z-index: 5; }
.empty { text-align: center; color: var(--muted); max-width: 380px; }
.empty h3 { color: var(--text); font-weight: 600; margin: 10px 0 4px; font-size: 15px; }
.empty svg { width: 34px; height: 34px; color: var(--faint); }
.drop { border: 1.5px dashed var(--line2); border-radius: 14px; padding: 48px 40px; cursor: pointer; background: var(--panel); }
.drop:hover, .drop.drag { border-color: var(--accent); }
.live { width: min(520px, 100%); text-align: center; }
.live .pv { aspect-ratio: 1; max-height: calc(100vh - 300px); margin: 0 auto 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.live .pv img { width: 100%; height: 100%; object-fit: contain; }
.live .pv svg { width: 30px; height: 30px; color: var(--faint); }
.live .txt { color: var(--muted); font: 12px var(--mono); margin-top: 8px; }
.strip { display: flex; gap: 8px; padding: 0 20px 12px; justify-content: center; overflow-x: auto; flex: none; }
.strip button { border: 2px solid transparent; padding: 0; border-radius: 8px; background: none; position: relative; }
.strip button.on { border-color: var(--accent); }
.strip img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; display: block; }
.strip span { position: absolute; bottom: 3px; left: 3px; font: 10px var(--mono); background: #000a; color: #fff; padding: 0 4px; border-radius: 3px; }
.infobar { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 14px; align-items: center; flex: none; flex-wrap: wrap; }
.infobar .p { flex: 1 1 220px; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: copy; }
.infobar .kv { display: flex; gap: 12px; font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.infobar .kv b { color: var(--text); font-weight: 500; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; }
.menu { position: relative; }
.menu .pop { position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px;
  padding: 4px; min-width: 170px; display: none; z-index: 10; box-shadow: 0 12px 30px var(--shadow); }
.menu.open .pop { display: block; }
.pop button { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: 0; padding: 7px 9px; border-radius: 6px; color: var(--muted); text-align: left; }
.pop button:hover { background: var(--panel2); color: var(--text); }
.outp { position: relative; background: repeating-linear-gradient(45deg, var(--panel2) 0 8px, var(--panel) 8px 16px);
  border: 1.5px dashed var(--accent); border-radius: 6px; }
.outp img { position: absolute; }
.dims { position: absolute; bottom: -24px; left: 0; right: 0; text-align: center; font: 11.5px var(--mono); color: var(--muted); }

/* right */
#right { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.rhead { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
.rhead h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; flex: 1; }
#queue { padding: 0 12px; max-height: 45vh; overflow-y: auto; flex: none; }
.task { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; }
.task .t { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.task .t b { font-weight: 550; flex: 1; }
.task .t .s { font: 11px var(--mono); color: var(--muted); }
.task .pr { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 3px 0 7px; }
.task .icon-btn { padding: 3px; }
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s linear; }
.bar.indet i { width: 30% !important; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.task.err { border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.task.err .pr { color: var(--danger); white-space: normal; max-height: 90px; overflow: auto; }
.filters { display: flex; gap: 6px; margin: 0 12px 8px; }
.filters select { width: 110px; flex: none; padding: 6px; }
#hist { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
.th { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--bg); border: 2px solid transparent; cursor: pointer; }
.th.on { border-color: var(--accent); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th .tag { position: absolute; left: 4px; bottom: 4px; font: 10px var(--mono); background: #000b; color: #ddd; padding: 1px 5px; border-radius: 4px; }
.th .use { position: absolute; right: 4px; top: 4px; display: none; background: #000b; color: #fff; border: 0; border-radius: 6px; padding: 4px; }
.th:hover .use { display: inline-flex; }
.more { grid-column: span 2; }
.muted { color: var(--muted); }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 30; align-items: center; }
#toast div { background: var(--panel); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 9px; box-shadow: 0 10px 30px var(--shadow); max-width: 520px; }
#toast div.err { border-color: var(--danger); }
.modal { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 18px 22px; width: min(460px, calc(100% - 32px)); }
.modal h3 { margin: 0 0 10px; font-size: 15px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.modal td { padding: 5px 0; color: var(--muted); } .modal td:first-child { color: var(--text); white-space: nowrap; padding-right: 16px; }
.spin { animation: rot 1s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } }

@media (max-width: 1100px) { main { grid-template-columns: 320px 1fr; } #right { display: none; } }
@media (max-width: 760px) {
  body { overflow: auto; grid-template-rows: auto 1fr; } main { grid-template-columns: 1fr; }
  #side { border-right: 0; } #stage { min-height: 70vh; } header { flex-wrap: wrap; padding: 8px 16px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>ComfyClaude <b>Studio</b></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stxt">connecting…</span></div>
  <button class="ghost sm" id="startBtn" hidden>Start ComfyUI</button>
  <div class="spacer"></div>
  <button class="ghost sm" id="freeBtn" title="Unload models from VRAM/RAM">Free VRAM</button>
  <button class="ghost sm" id="outBtn" title="Open the output folder"></button>
  <button class="ghost sm" id="refreshBtn" title="Re-scan models, LoRAs and workflows"></button>
  <button class="ghost sm" id="themeBtn" title="Light / dark"></button>
  <button class="ghost sm" id="helpBtn" title="Keyboard shortcuts (?)">?</button>
</header>
<main>
  <section id="side">
    <div class="modes" id="modes"></div>
    <div class="form" id="form"></div>
    <div class="go"><button id="goBtn"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg><span>Generate</span></button>
      <div class="hint" id="est"></div></div>
  </section>
  <section id="stage"></section>
  <aside id="right">
    <div class="rhead"><h3>Queue</h3><button class="ghost sm" id="clearBtn" hidden>Clear queued</button></div>
    <div id="queue"></div>
    <div class="rhead"><h3>History</h3><button class="ghost sm" id="histRefresh" title="Refresh"></button></div>
    <div class="filters"><input type="text" id="search" placeholder="Search prompts…"><select id="toolFilter"></select></div>
    <div id="hist"></div>
  </aside>
</main>
<div id="cursor"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const ICONS = {
  spark: '<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5L5 20"/>',
  pose: '<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-2 5 2M9 21l3-7 3 7"/>',
  brush: '<path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-5 2-5 5 0 1.5-1 3-1 3s4 1 6-1c1.6-1.6 2-4 0-7"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1.5" stroke-dasharray="3 2"/>',
  expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  drop: '<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>',
  up: '<path d="M4 20h16M12 16V4M6 10l6-6 6 6"/>',
  cut: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
  flow: '<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h4a2 2 0 0 1 2 2v7"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8" fill="currentColor"/><circle cx="15" cy="15" r=".8" fill="currentColor"/><circle cx="15" cy="9" r=".8" fill="currentColor"/><circle cx="9" cy="15" r=".8" fill="currentColor"/>',
  recycle: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

const Painter = {

  reset() { this.canvas = null; this.path = null; this.undo = []; },

  snapshot() { const c = this.canvas; this.undo.push(c.getContext('2d').getImageData(0, 0, c.width, c.height)); if (this.undo.length > 25) this.undo.shift(); },

  }
  if (meta.mask_mode) v.mask_mode = ['subject', 'background'].includes(meta.mask_mode) ? meta.mask_mode : 'file';
  if (meta.pad) [v.left, v.top, v.right, v.bottom] = meta.pad;
  if (meta.loras) v.loras = meta.loras.map(l => ({ name: l.name, strength: l.strength_model ?? 1 }));
  if (meta.source || meta.reference) setSrc(meta.source || meta.reference);
  setMode(id); toast('Settings loaded');
}
function finalize(meta) {
  const v = (S.vals.create ??= {});
  [v.prompt, v.style] = splitStyle(meta.prompt || '');
  v.seed = String(meta.seed);
  const k = Math.sqrt(1048576 / (meta.width * meta.height));
  v.width = r16(meta.width * k); v.height = r16(meta.height * k); v.quality = '';
  v.loras = (meta.loras || []).map(l => ({ name: l.name, strength: l.strength_model ?? 1 }));
  setMode('create'); toast('Draft loaded into Create at full size. Press Generate.');
}

/* ---------------- run ---------------- */
function collect(fields, v, p) {
  for (const f of fields) {
    if (f.show && !f.show(v)) continue;
    if (f.t === 'adv') collect(f.fields, v, p);
    else if (f.t === 'size') { p.width = v.width; p.height = v.height; }
    else if (f.t === 'seed') p.seed = v.seed ? +v.seed : -1;
    else if (f.t === 'quality') p.quality = v.quality || '';
    else if (f.t === 'style') p.style = v.style || '';
    else if (f.t === 'editmodel') p.edit_model = v.edit_model || '';
    else if (f.t === 'prompt') p.prompt = (v.prompt || '').trim();
    else if (f.t === 'pads') ['left', 'top', 'right', 'bottom'].forEach(k => p[k] = v[k]);
    else if (f.t === 'image') { const path = f.shared ? S.src?.path : v[f.k]; if (path) p[f.k] = path; }
    else if (f.t === 'model') p.model = v.model;
    else if (f.t === 'color') p.color = v.color;
    else if (f.t === 'batch') continue;
    else if (f.t === 'loras') { if (v.loras?.length) p.loras = v.loras.map(l => ({ name: l.name, strength_model: l.strength, strength_clip: l.strength })); }
    else if (f.k && v[f.k] !== undefined && v[f.k] !== '') p[f.k] = v[f.k];
  }
  return p;
}

let running = false;
async function run() {
  if (running) return;
  const m = M(S.mode), v = V();
  running = true;
  try {
    let p = collect(m.fields, v, {});
    if (m.fields.some(f => f.t === 'image' && f.shared) && !p.image_path) throw new Error('Choose an input image first.');
    if (m.fields.some(f => f.t === 'prompt' && (!f.show || f.show(v))) && !p.prompt) throw new Error('Write a prompt first.');
    if (m.paint?.(v)) p.mask_path = await Painter.export();
    if (m.id === 'sdxl') p.negative_prompt = v.negative_prompt ?? null;
    if (m.id === 'outpaint' && !(p.left || p.top || p.right || p.bottom)) throw new Error('Choose how far to extend the image.');
    if (m.id === 'workflow') {
      if (!v._wf) throw new Error('No workflow selected.');
      const wv = v.wf?.[v._wf] || {}, params = {};
      for (const k of S.info.workflows[v._wf] || []) {
        const x = wv[k] ?? '';
        if (k === 'seed') { if (x !== '') params.seed = +x; continue; }
        if (k.startsWith('image') && !x) throw new Error(`Choose an image for ${k}.`);
        params[k] = /^-?\d+(\.\d+)?$/.test(x) ? +x : x;
      }
      p = { name: v._wf, params, ...(p.save_to ? { save_to: p.save_to } : {}) };
    }
    if (p.prompt) { const r = store.get('prompts', []).filter(x => x !== p.prompt); r.unshift(p.prompt); store.set('prompts', r.slice(0, 40)); }
    const n = hasField(m.fields, 'batch') ? (v.batch || 1) : 1;
    const base = p.seed === -1 && n > 1 ? Math.floor(Math.random() * 2 ** 31) : p.seed;
    S.group++; S.follow = new Set(); S.compare = false;
    for (let i = 0; i < n; i++) {
      const task = await api('/api/run', { tool: m.tool, params: n > 1 ? { ...p, seed: base + i } : p });
      task.group = S.group; S.follow.add(task.id); S.tasks.unshift(task);
    }
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    S.tab = 'output'; renderStage(); renderQueue(); poll();
  } catch (e) { toast(e.message, 1); }
  finally { running = false; }
}

function estimate(tool, quality) {
  const t = S.info?.timings || {}, q = quality || S.info?.tool_quality?.[tool] || '';
  return t[`${tool}|${q}`] ?? t[`${tool}|`] ?? Object.entries(t).find(([k]) => k.startsWith(tool + '|'))?.[1] ?? null;
}
function updateEstimate() {
  const m = M(S.mode), v = V(), e = estimate(m.tool, v.quality), n = hasField(m.fields, 'batch') ? (v.batch || 1) : 1;
  $('#est').innerHTML = '';
  $('#est').append(...(e ? [`~${Math.round(e * n)}s on this PC · `] : []), h('kbd', {}, 'Ctrl'), ' + ', h('kbd', {}, 'Enter'));
  $('#goBtn span').textContent = (m.group === 'Edit' ? 'Run ' + m.label : 'Generate') + (n > 1 ? ` ×${n}` : '');
}

/* ---------------- queue / history ---------------- */
let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const tasks = await api('/api/tasks');
    for (const t of tasks) {
      const old = S.tasks.find(x => x.id === t.id);
      t.group = old?.group;
      if (old && old.status !== t.status && ['done', 'error', 'cancelled'].includes(t.status)) finished(t);
    }
    S.tasks = tasks; renderQueue();
    const live = liveTask();
    if (live) { const el = $('#live'); if (el) { const area = el.parentNode; area.innerHTML = ''; renderLive(area, live); } else renderStage(); }
  } catch {}
  const active = S.tasks.filter(t => t.status === 'queued' || t.status === 'running');
  const run = active.find(t => t.status === 'running');
  document.title = run ? `${Math.round(progressOf(run))}% · ${TOOL_NAMES[run.tool]} — Studio` : 'ComfyClaude Studio';
  pollTimer = setTimeout(poll, active.length ? 800 : 5000);
}
function finished(t) {
  if (t.status === 'done') {
    loadHistory();
    const imgs = t.images.filter(i => !['Contact sheet', 'Applied mask'].includes(i.label) && !/_map_/.test(i.path));
    const shown = imgs.length ? imgs : t.images;
    if (S.follow.has(t.id)) {
      if (S.view?.group === S.group) S.view.images.push(...shown);
      else S.view = { images: shown, idx: 0, group: S.group };
      if (!(M(S.mode).input && S.tab === 'input')) S.tab = 'output';
      renderStage(); renderForm();
    }
    notify(`${TOOL_NAMES[t.tool]} done`, t.params.prompt || '');
  } else if (t.status === 'error') { notify(`${TOOL_NAMES[t.tool]} failed. Details are in the queue.`, t.text.slice(0, 120), true); if (S.follow.has(t.id)) renderStage(); }
  else if (S.follow.has(t.id)) renderStage();
}
function notify(title, body, err) {
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') try { new Notification(title, { body }); } catch {}
  else if (!document.hidden) toast(title, err);
}
function renderQueue() {
  const q = $('#queue'); q.innerHTML = '';
  const shown = S.tasks.filter(t => ['queued', 'running'].includes(t.status) || (t.status === 'error' && !S.dismissed[t.id]));
  $('#clearBtn').hidden = S.tasks.filter(t => t.status === 'queued').length < 2;
  if (!shown.length) { q.append(h('div', { class: 'muted', style: 'font-size:12px;padding:0 2px 10px' }, 'Idle')); return; }
  for (const t of shown) {
    const p = t.params || {}, err = t.status === 'error', pct = progressOf(t);
    const el = t.started ? Math.round(Date.now() / 1000 - t.started) : 0;
    const est = estimate(t.tool, p.quality);
    q.append(h('div', { class: 'task' + (err ? ' err' : '') },
      h('div', { class: 't' }, t.status === 'running' ? icon('recycle', 'spin') : null, h('b', {}, TOOL_NAMES[t.tool]),
        h('span', { class: 's' }, err ? 'failed' : t.status === 'running' ? (t.progress?.max ? `${t.progress.value}/${t.progress.max} · ${el}s` : `${el}s${est ? ' / ~' + Math.round(est) + 's' : ''}`) : 'queued'),
        err ? h('button', { class: 'icon-btn', title: 'Retry', onclick: () => api('/api/retry/' + t.id, {}).then(n => { S.dismissed[t.id] = 1; S.follow = new Set([n.id]); S.group++; S.tasks.unshift(n); poll(); }).catch(e => toast(e.message, 1)) }, icon('refresh')) : null,
        h('button', { class: 'icon-btn', title: err ? 'Dismiss' : 'Cancel', onclick: () => err ? (S.dismissed[t.id] = 1, renderQueue()) : api('/api/cancel/' + t.id, {}).then(poll) }, icon('x'))),
      h('div', { class: 'pr', title: err ? '' : p.prompt || '' }, err ? t.text : (p.prompt || p.name || basename(p.image_path || '') || (p.seed >= 0 ? 'seed ' + p.seed : ''))),
      err ? null : h('div', { class: 'bar' + (pct ? '' : ' indet') }, h('i', { style: `width:${pct}%` }))));
  }
}
async function loadHistory() {
  try { S.history = await api('/api/history'); } catch { S.history = []; }
  if (!S.view && S.history[0]) { S.view = { images: [S.history[0]], idx: 0 }; renderStage(); }
  const tools = [...new Set(S.history.map(i => i.meta.tool).filter(Boolean))];
  const sel = $('#toolFilter'); sel.innerHTML = '';
  sel.append(h('option', { value: '' }, 'All tools'), ...tools.map(t => h('option', { value: t }, TOOL_NAMES[t] || t)));
  sel.value = tools.includes(S.toolFilter) ? S.toolFilter : '';
  renderHistory();
}
function filteredHistory() {
  const f = S.filter.toLowerCase();
  return S.history.filter(i => (!S.toolFilter || i.meta.tool === S.toolFilter) &&
    (!f || [i.meta.prompt, i.meta.workflow, i.meta.model, String(i.meta.seed ?? '')].some(x => (x || '').toLowerCase().includes(f))));
}
function renderHistory() {
  const box = $('#hist'); box.innerHTML = '';
  const items = filteredHistory();
  if (!items.length) box.append(h('div', { class: 'muted', style: 'grid-column:span 2;font-size:12px' }, S.history.length ? 'No matches' : 'Generated images appear here.'));
  const cur = currentImage()?.path;
  for (const it of items.slice(0, S.histLimit)) {
    box.append(h('div', { class: 'th' + (it.path === cur ? ' on' : ''), title: it.meta.prompt || basename(it.path), draggable: 'true',
        ondragstart: e => e.dataTransfer.setData('text/cc-path', it.path),
        onclick: () => showItem(it) },
      h('img', { src: thumbUrl(it.path), loading: 'lazy' }),
      h('span', { class: 'tag' }, TOOL_NAMES[it.meta.tool] || it.meta.tool || ''),
      h('button', { class: 'use', title: 'Use as input image', onclick: e => { e.stopPropagation(); setSrc(it.path); } }, icon('edit'))));
  }
  if (items.length > S.histLimit) box.append(h('button', { class: 'ghost sm more', onclick: () => { S.histLimit += 60; renderHistory(); } }, `Show more (${items.length - S.histLimit})`));
}
function showItem(it) {
  S.view = { images: [it], idx: 0 }; S.follow = new Set(); S.compare = false;
  if (M(S.mode).input) S.tab = 'output';
  renderStage(); renderHistory();
}
function stepHistory(d) {
  const items = filteredHistory(), i = items.findIndex(x => x.path === currentImage()?.path), n = items[i + d];
  if (n) showItem(n);
}

/* ---------------- info / boot ---------------- */
function setStatus(ok, label, title) {
  $('#dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  $('#stxt').textContent = label; $('#stxt').title = title || '';
  $('#startBtn').hidden = ok;
}
async function loadInfo() {
  try { S.info = await api('/api/info'); } catch (e) { toast(e.message, 1); return; }
  const ok = S.info.comfy.ok;
  setStatus(ok, ok ? 'ComfyUI · ' + S.info.comfy.url.replace(/^https?:\/\//, '') : 'ComfyUI offline', ok ? `Outputs: ${S.info.output_dir}` : S.info.comfy.error);
  renderForm();
}
let wasOnline = null;
async function ping() {
  try {
    const r = await api('/api/ping');
    if (r.comfy !== wasOnline) { if (r.comfy && wasOnline === false) loadInfo(); else setStatus(r.comfy, r.comfy ? 'ComfyUI · ' + r.url.replace(/^https?:\/\//, '') : 'ComfyUI offline'); }
    wasOnline = r.comfy;
  } catch { setStatus(false, 'Studio server offline'); wasOnline = false; }
}
function showHelp() {
  if ($('.modal')) return $('.modal').remove();
  const rows = [['Ctrl + Enter', 'Generate / run'], ['Ctrl + V', 'Paste an image as input'], ['← / →', 'Previous / next image in history'],
    ['B / R', 'Brush / box mask tool'], ['E', 'Toggle eraser'], ['[ / ] or wheel', 'Brush size'], ['Ctrl + Z', 'Undo mask stroke'],
    ['C', 'Compare with source'], ['Double-click image', 'Open full size'], ['Drag an image', 'Drop it on any image slot'], ['?', 'This help']];
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) m.remove(); } },
    h('div', { class: 'box' }, h('h3', {}, 'Keyboard shortcuts'), h('table', {}, rows.map(([k, d]) => h('tr', {}, h('td', {}, k), h('td', {}, d))))));
  document.body.append(m);
}
function setTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next; store.set('theme', next); themeIcon();
}
function themeIcon() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  $('#themeBtn').replaceChildren(icon(cur === 'light' ? 'moon' : 'sun'));
}

$('#outBtn').append(icon('folder')); $('#refreshBtn').append(icon('refresh')); $('#histRefresh').append(icon('refresh')); themeIcon();
$('#startBtn').onclick = async e => {
  e.target.disabled = true; $('#stxt').textContent = 'starting ComfyUI…';
  try { await api('/api/start', {}); } catch (err) { toast(err.message, 1); }
  e.target.disabled = false; loadInfo();
};
$('#freeBtn').onclick = () => api('/api/free', {}).then(() => toast('Models unloaded')).catch(e => toast(e.message, 1));
$('#outBtn').onclick = () => api('/api/reveal', {}).catch(e => toast(e.message, 1));
$('#refreshBtn').onclick = () => loadInfo().then(() => toast('Models, LoRAs and workflows rescanned'));
$('#themeBtn').onclick = setTheme;
$('#helpBtn').onclick = showHelp;
$('#clearBtn').onclick = () => api('/api/clear', {}).then(poll);
$('#histRefresh').onclick = loadHistory;
$('#search').oninput = e => { S.filter = e.target.value; S.histLimit = 60; renderHistory(); };
$('#toolFilter').onchange = e => { S.toolFilter = e.target.value; S.histLimit = 60; renderHistory(); };
$('#goBtn').onclick = run;
document.addEventListener('click', e => {
  document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  if (!e.target.closest('.recent')) document.querySelectorAll('.recent').forEach(r => r.remove());
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => { e.preventDefault(); try { const p = await droppedPath(e); if (p) setSrc(p); } catch (err) { toast(err.message, 1); } });
document.addEventListener('paste', async e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) { e.preventDefault(); try { setSrc(await upload(f, 'pasted.png')); toast('Image pasted as input'); } catch (err) { toast(err.message, 1); } }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (e.key === 'Escape') { $('.modal')?.remove(); document.querySelectorAll('.recent').forEach(r => r.remove()); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const painting = Painter.canvas && M(S.mode).input && S.tab === 'input' && M(S.mode).paint?.(V());
  if (painting && (e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); Painter.doUndo(); }
  else if (e.ctrlKey || e.metaKey || e.altKey) return;
  else if (painting && e.key === '[') Painter.setBrush(Painter.brush / 1.2);
  else if (painting && e.key === ']') Painter.setBrush(Painter.brush * 1.2);
  else if (painting && (e.key === 'b' || e.key === 'r')) { Painter.tool = e.key === 'b' ? 'brush' : 'rect'; renderStage(); }
  else if (painting && e.key === 'e') { Painter.erase = !Painter.erase; renderStage(); }
  else if (e.key === 'c' && currentImage() && sourceOf(currentImage())) { S.compare = !S.compare; renderStage(); }
  else if (e.key === '?') showHelp();
  else if (e.key === 'ArrowLeft') stepHistory(-1);
  else if (e.key === 'ArrowRight') stepHistory(1);
});
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => S.mode === 'outpaint' && renderStage(), 150); });

if (!M(S.mode)) S.mode = 'create';
renderModes(); renderForm(); renderStage();
loadInfo(); loadHistory(); poll(); ping(); setInterval(ping, 10000);
</script>
